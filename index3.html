const names=document.querySelectorAll('.tab'),box=document.getElementById('frames'),fr=[];
function dec(b){return new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)))}
function show(i){
  names.forEach((t,j)=>t.classList.toggle('active',i===j));
  if(!fr[i]){const f=document.createElement('iframe');f.srcdoc=dec(D[i]);box.appendChild(f);fr[i]=f}
  fr.forEach((f,j)=>f&&f.classList.toggle('show',i===j));
  location.hash='t'+i;
}
names.forEach((t,i)=>t.onclick=()=>show(i));
const h=parseInt((location.hash||'').slice(2));show(h>=0&&h<D.length?h:0);
</script></body></html>
