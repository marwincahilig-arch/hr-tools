<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payroll &amp; Attendance Tools</title>
<style>
:root{--bg:#f4f5fa;--surface:#fff;--line:#e3e6f0;--fg:#141a2e;--muted:#6a7392;--accent:#5f60a7;--sbw:276px;--sb1:#141a47;--sb2:#20285f;--ease:cubic-bezier(.4,0,.2,1)}
[data-theme=dark]{--bg:#0e1224;--surface:#161b33;--line:#272e4d;--fg:#e8ebf7;--muted:#8f98ba}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* Sidebar */
aside{width:var(--sbw);flex:none;background:radial-gradient(120% 60% at 0% 0%,#3b4a93 0%,transparent 60%),linear-gradient(180deg,var(--sb2),var(--sb1));color:#cfd5f1;display:flex;flex-direction:column;padding:22px 14px 16px;position:relative;z-index:30;transition:width .25s var(--ease),transform .25s var(--ease);border-right:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#6667ad,#959dc5 60%,#c4c4de);box-shadow:0 8px 22px -6px rgba(149,157,197,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.logo svg{width:22px;height:22px;stroke:#fff}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:-.01em;line-height:1.15}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8e97c8}
.label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6f79ad;padding:6px 12px 8px;white-space:nowrap}
nav{display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:#aab2dc;position:relative;transition:background .15s,color .15s;white-space:nowrap}
.item:hover{background:rgba(255,255,255,.06);color:#fff}
.item .ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.06);transition:.15s}
.item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item .tx{min-width:0;overflow:hidden}
.item .tx b{display:block;font-weight:600;font-size:14px}
.item .tx small{display:block;font-size:11.5px;color:#7f89bd;overflow:hidden;text-overflow:ellipsis}
.item.active{background:linear-gradient(90deg,rgba(102,103,173,.32),rgba(102,103,173,.08));color:#fff;box-shadow:inset 0 0 0 1px rgba(149,157,197,.28)}
.item.active::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(#a9aedd,#6667ad)}
.item.active .ic{background:linear-gradient(135deg,#6667ad,#5f60a7);box-shadow:0 6px 14px -4px rgba(102,103,173,.8)}
.spacer{flex:1}
.privacy{margin:0 4px 12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-size:12px;color:#97a0cf;display:flex;gap:10px;line-height:1.4}
.privacy svg{width:18px;height:18px;flex:none;stroke:#86efac;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.privacy b{color:#e3e7ff;display:block;font-weight:600}
.collapse{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#7f89bd;padding:8px 12px;border-radius:10px;white-space:nowrap}
.collapse:hover{background:rgba(255,255,255,.06);color:#fff}
.collapse svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
/* Collapsed */
body.mini{--sbw:84px}
body.mini .brand div,body.mini .item .tx,body.mini .label,body.mini .privacy div,body.mini .collapse span{display:none}
body.mini .item{justify-content:center;padding:9px 0}
body.mini .privacy{justify-content:center;padding:10px 0}
body.mini .collapse{justify-content:center}
body.mini .collapse svg{transform:rotate(180deg)}
body.mini .brand{justify-content:center;padding-left:0;padding-right:0}
body.mini .item.active::before{left:-14px}
/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.menu{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);place-items:center}
.menu svg,.theme svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:13px}
.crumb b{color:var(--fg);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb i{opacity:.5;font-style:normal}
.hsp{flex:1}
.chip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;color:#15803d;background:#e2f6ea}
[data-theme=dark] .chip{background:#173326;color:#6fd49a}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.theme{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:.15s}
.theme:hover,.menu:hover{border-color:var(--accent);color:var(--accent)}
.theme .moon{display:none}[data-theme=dark] .theme .sun{display:none}[data-theme=dark] .theme .moon{display:block}
#frames{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.show{display:block;animation:in .3s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{display:none}
@media(max-width:900px){
 aside{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);width:288px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
 body.open aside{transform:none}
 body.mini{--sbw:276px}body.mini .brand div,body.mini .item .tx,body.mini .label,body.mini .privacy div,body.mini .collapse span{display:revert}
 .collapse{display:none}.menu{display:grid}.chip{display:none}
 .scrim{position:fixed;inset:0;background:rgba(5,8,22,.55);z-index:20;backdrop-filter:blur(2px)}
 body.open .scrim{display:block}
 header{padding:0 14px}
}
#toast{position:fixed;right:20px;bottom:20px;z-index:60;max-width:360px;padding:12px 16px;border-radius:12px;background:#141a47;color:#fff;font-size:13px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s var(--ease)}
#toast.on{opacity:1;transform:none}#toast.err{background:#7f1d1d}
@media print{aside,header,.scrim{display:none!important}body{display:block;overflow:visible}}
</style></head><body>
<aside>
 <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div><div><b>Payroll &amp; Attendance</b><span>Tools</span></div></div>
 <div class="label">Workspace</div>

<main>

 </header>
 <div id="frames"></div>
</main>

const $=s=>document.querySelector(s),nav=$('#nav'),box=$('#frames'),fr=[];
let theme='light',cur=0;
try{theme=localStorage.getItem('pat-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(localStorage.getItem('pat-mini')==='1')document.body.classList.add('mini')}catch(e){}
T.forEach((t,i)=>{const b=document.createElement('button');b.className='item';b.innerHTML='<span class="ic"><svg viewBox="0 0 24 24">'+t.i+'</svg></span><span class="tx"><b>'+t.n.replace('&','&amp;')+'</b><small>'+t.d+'</small></span>';b.title=t.n;b.onclick=()=>show(i);nav.appendChild(b)});
function dec(b){return new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)))}
function applyTheme(){document.documentElement.dataset.theme=theme;fr.forEach(f=>f&&f.contentWindow&&f.contentWindow.postMessage({theme},'*'))}
function show(i){
 cur=i;
 nav.querySelectorAll('.item').forEach((b,j)=>b.classList.toggle('active',i===j));
 $('#title').textContent=T[i].n;document.title=T[i].n+' · Payroll & Attendance Tools';
 if(!fr[i]){const f=document.createElement('iframe');f.title=T[i].n;f.srcdoc=dec(D[i]).replace('<html','<html data-theme="'+theme+'"');box.appendChild(f);fr[i]=f}
 fr.forEach((f,j)=>f&&f.classList.toggle('show',i===j));
 document.body.classList.remove('open');
 try{history.replaceState(null,'','#t'+i)}catch(e){location.hash='t'+i}
}
$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('pat-theme',theme)}catch(e){}applyTheme()};
$('#col').onclick=()=>{const m=document.body.classList.toggle('mini');try{localStorage.setItem('pat-mini',m?'1':'0')}catch(e){}};
$('#menu').onclick=()=>document.body.classList.add('open');
$('#scrim').onclick=()=>document.body.classList.remove('open');
addEventListener('keydown',e=>{if(e.altKey&&/^[1-4]$/.test(e.key)){show(+e.key-1)}});
addEventListener('hashchange',()=>{const h=parseInt((location.hash||'').slice(2));if(h>=0&&h<D.length&&h!==cur)show(h)});
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',err?7000:3500)}
addEventListener('message',async e=>{const m=e.data||{};
 if(m.err){toast('Something went wrong: '+m.err,true);return}
 const d=m.dl;if(!d)return;let ok=false;
 try{if(window.claude&&claude.use){const DL=await claude.use('downloads');await DL.save({filename:d.name,data:new Uint8Array(await d.blob.arrayBuffer())});ok=true}}catch(_){}
 if(!ok){try{const u=URL.createObjectURL(d.blob),a=document.createElement('a');a.href=u;a.download=d.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);ok=true}catch(x){toast('Download failed: '+x.message,true);return}}
 toast('Saved '+d.name)});
applyTheme();
const h=parseInt((location.hash||'').slice(2));show(h>=0&&h<D.length?h:0);
